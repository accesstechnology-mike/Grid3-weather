<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app places-app">
    <header class="day-header places-header">
      <h1 id="day-title">Where?</h1>
    </header>
    <nav class="place-links grid-clickable-group" aria-label="Choose place">
      <a href="index.html?location=cobham">
        <img class="place-flag" alt="" src="flags/gb.svg">
        <span>Cobham</span>
      </a>
      <a href="index.html?location=nottingham">
        <img class="place-flag" alt="" src="flags/gb.svg">
        <span>Nottingham</span>
      </a>
      <a href="index.html?location=london">
        <img class="place-flag" alt="" src="flags/gb.svg">
        <span>London</span>
      </a>
      <a href="index.html?location=lagos">
        <img class="place-flag" alt="" src="flags/ng.svg">
        <span>Lagos</span>
      </a>
      <a href="index.html?location=san-diego">
        <img class="place-flag" alt="" src="flags/us.svg">
        <span>San Diego</span>
      </a>
    </nav>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
